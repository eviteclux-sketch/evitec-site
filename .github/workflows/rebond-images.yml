# Télécharge les photos Unsplash listées dans rebond/img/candidats.txt (le conteneur de travail n'a pas accès à Unsplash).
name: rebond-images
on:
  push:
    branches: [rebond-src]
    paths: [rebond/img/candidats.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        run: |
          mkdir -p rebond/img/cand
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          : > rebond/img/log.txt
          while read -r id; do
            case "$id" in ""|\#*) continue;; esac
            f="rebond/img/cand/$id.jpg"
            page=$(curl -sL -A "$UA" "https://unsplash.com/photos/$id" || true)
            og=$(printf '%s' "$page" | grep -oE 'https://(images|plus)\.unsplash\.com/[^"?]+' | head -1 || true)
            plus=$(printf '%s' "$page" | grep -c 'Unsplash+' || true)
            if [ -n "$og" ]; then
              code=$(curl -sL -A "$UA" -o "$f" -w '%{http_code} %{content_type}' "$og?w=1600&q=72&fm=jpg&fit=max" || echo erreur)
            else code="pas_trouve"; fi
            echo "$id | $og | $code | plus=$plus" | tee -a rebond/img/log.txt
            case "$code" in *image*) ;; *) rm -f "$f";; esac
          done < rebond/img/candidats.txt
      - name: Commit
        run: |
          git config user.name "rebond-bot"; git config user.email "rebond-bot@users.noreply.github.com"
          git add rebond/img
          git commit -m "Photos candidates" || echo rien
          git push
