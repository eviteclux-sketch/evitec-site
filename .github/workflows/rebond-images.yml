# Télécharge les photos Unsplash listées dans rebond/img/candidats.txt (le conteneur de travail n'a pas accès à Unsplash).
name: rebond-images
on:
  push:
    branches: [rebond-src]
    paths: [rebond/img/candidats.txt, rebond/img/requetes.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger (Wikimedia Commons)
        run: python3 rebond/img/commons.py
      - name: Commit
        run: |
          git config user.name "rebond-bot"; git config user.email "rebond-bot@users.noreply.github.com"
          git add rebond/img
          git commit -m "Photos candidates" || echo rien
          git push
