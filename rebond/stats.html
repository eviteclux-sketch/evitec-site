<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REBOND · Chiffres</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
/* Page privée du propriétaire : une colonne, totaux puis détails. */
:root{--bg:#f3f4f7;--paper:#fff;--ink:#15202b;--ink2:#4a5566;--line:#d9dde5;--accent:#1d4ed8;--red:#b3261e;
--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--paper:#1a2129;--ink:#eef1f5;--ink2:#b4bcc8;--line:#2c3642;--accent:#7aa2ff;--red:#ff8a80;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:2.4rem;margin:0;text-transform:uppercase}
h2{font-family:var(--display);font-size:1.4rem;margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile b{display:block;font-family:var(--display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.tile span{color:var(--ink2);font-size:.85rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:grid;grid-template-columns:minmax(0,11em) 1fr 3em;gap:10px;align-items:center;padding:4px 0;font-size:.9rem}
.row .t{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.row .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.row .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink2);font-size:.9rem}.err{color:var(--red)}
</style></head><body><div class="wrap">
<h1>REBOND · chiffres</h1>
<p class="muted" id="st">Chargement…</p>
<div class="tiles" id="tiles"></div>
<div id="blocks"></div>
</div>
<script>
const API="https://sccdpqlohylgfhrooqoo.supabase.co/functions/v1/rebond";
const LBL={visite:"Visites",page_ent:"Page entrepreneur ouverte",page_sal:"Page salarié ouverte",mission_ouverte:"Mission ouverte",doc_lance:"Document demandé",doc_ok:"Document rédigé",bilan_lance:"Bilan lancé",bilan_ok:"Bilan rendu",verrou:"Mission payante consultée",exemple:"Exemple de bilan ouvert",langue:"Langue changée",erreur:"Erreur"};
const $=s=>document.querySelector(s);
function bars(title,obj,label){
  const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]); const max=Math.max(1,...e.map(x=>x[1]));
  const p=document.createElement("div"); p.className="panel";
  p.innerHTML=`<h2>${title}</h2>`+e.map(([k,v])=>`<div class="row"><span>${(label?label(k):k).replace(/</g,"&lt;")}</span><span class="t"><i style="width:${100*v/max}%"></i></span><span class="v">${v}</span></div>`).join("");
  return p;
}
(async()=>{
  const token=new URLSearchParams(location.search).get("token");
  if(!token){ $("#st").textContent="Il manque le code d'accès dans le lien."; return; }
  let d; try{ const r=await fetch(API+"/stats?token="+encodeURIComponent(token)); d=await r.json(); if(!r.ok) throw 0; }catch(e){ $("#st").innerHTML='<span class="err">Accès refusé ou serveur injoignable.</span>'; return; }
  const pe=d.par_evenement||{};
  $("#st").textContent="Mis à jour le "+new Date().toLocaleString("fr-BE")+". Compteur anonyme : aucun contenu saisi n'est enregistré.";
  [["Visiteurs uniques",d.visiteurs],["Visites",pe.visite||0],["Bilans rendus",pe.bilan_ok||0],["Documents rédigés",pe.doc_ok||0]].forEach(([l,v])=>{ const t=document.createElement("div"); t.className="tile"; t.innerHTML=`<b>${v}</b><span>${l}</span>`; $("#tiles").append(t); });
  const B=$("#blocks");
  B.append(bars("Actions",pe,k=>LBL[k]||k));
  B.append(bars("Langue de l'appli",d.par_langue||{}));
  B.append(bars("Par jour",Object.fromEntries(Object.entries(d.par_jour||{}).sort().reverse())));
  const det=Object.fromEntries(Object.entries(d.detail||{}).filter(([k])=>/^(doc_ok|mission_ouverte|verrou|visite|erreur):./.test(k)));
  B.append(bars("Détail (type de mission, provenance, erreurs)",det,k=>{ const [e,x]=k.split(":"); return (LBL[e]||e)+" · "+x; }));
})();
</script></body></html>
