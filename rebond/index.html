<style>
/* Layout: one column, 680px max, mobile-first. Panels stack; tabs become a scrollable strip. */
:root{
  --bg:#f3f4f7; --paper:#ffffff; --ink:#15202b; --ink-2:#4a5566; --ink-3:#7c8797;
  --line:#d9dde5; --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --forte:#b4421a; --forte-soft:#fbe6dc; --partielle:#9a6a05; --partielle-soft:#fbefcf; --faible:#1f7a4d; --faible-soft:#dcf2e6;
  --ent-bg:#1d4ed8; --ent-fg:#ffffff; --sal-bg:#b3261e; --sal-fg:#ffffff; --cold-bg:#0b1118; --cold-fg:#f2f5f8; --cold-dim:#9aa6b4;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1419; --paper:#1a2129; --ink:#eef1f5; --ink-2:#b4bcc8; --ink-3:#7f8a99; --line:#2c3642;
  --accent:#7aa2ff; --accent-ink:#0b1220; --accent-soft:#1d2a47;
  --ent-bg:#2c55c4; --ent-fg:#ffffff; --sal-bg:#c8372b; --sal-fg:#ffffff; --cold-bg:#05080c; --cold-fg:#f2f5f8; --cold-dim:#9aa6b4;
  --forte:#ff9a6e; --forte-soft:#3b2117; --partielle:#f0c25a; --partielle-soft:#3a2f12; --faible:#6fd3a0; --faible-soft:#14301f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1419; --paper:#1a2129; --ink:#eef1f5; --ink-2:#b4bcc8; --ink-3:#7f8a99; --line:#2c3642;
  --accent:#7aa2ff; --accent-ink:#0b1220; --accent-soft:#1d2a47;
  --ent-bg:#2c55c4; --ent-fg:#ffffff; --sal-bg:#c8372b; --sal-fg:#ffffff; --cold-bg:#05080c; --cold-fg:#f2f5f8; --cold-dim:#9aa6b4;
  --forte:#ff9a6e; --forte-soft:#3b2117; --partielle:#f0c25a; --partielle-soft:#3a2f12; --faible:#6fd3a0; --faible-soft:#14301f;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 48px;padding-inline:16px}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.6rem;font-weight:700}
h2{font-size:1.9rem;font-weight:700}
h3{font-size:1.3rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.06em;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand b{color:var(--accent)}
.nav{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.nav .btn{padding:5px 6px;font-size:.78rem;min-height:34px}
.brand{font-size:1.3rem}
.btn{font-family:var(--body);font-weight:600;font-size:.95rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:6px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px}
.panel.flat{background:transparent;border:0;padding:0}
.doors{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.doors{grid-template-columns:1fr 1fr}}
.door{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--body);min-width:0}
.door:hover{border-color:var(--accent)}
.door .k{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.05}
.door ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:.95rem}
.door .go{margin-top:auto;color:var(--accent);font-weight:600}
label{display:block;font-weight:600;font-size:.95rem;margin-bottom:6px}
label .opt{font-weight:400;color:var(--ink-3)}
input[type=text],textarea,select{width:100%;font-family:var(--body);font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
.field{margin-bottom:14px}
.hint{font-size:.85rem;color:var(--ink-3);margin-top:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-2);font-family:var(--body);font-weight:600;font-size:.95rem;padding:10px 12px;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.task{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px;padding:14px 16px;background:var(--paper)}
.task.forte{border-left-color:var(--forte)}
.task.partielle{border-left-color:var(--partielle)}
.task.faible{border-left-color:var(--faible)}
.chip{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.chip.forte{background:var(--forte-soft);color:var(--forte)}
.chip.partielle{background:var(--partielle-soft);color:var(--partielle)}
.chip.faible{background:var(--faible-soft);color:var(--faible)}
.chip.neutral{background:var(--accent-soft);color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media (min-width:560px){.kv{grid-template-columns:1fr 1fr}}
.kv div{min-width:0}
.kv .eyebrow{margin-bottom:3px}
.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.big{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big.forte{color:var(--forte)} .big.partielle{color:var(--partielle)} .big.faible{color:var(--faible)}
.check{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent)}
.check .t{font-weight:600}
.check.done .t{text-decoration:line-through;color:var(--ink-3)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.formation{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--bg)}
.formation .meta{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);margin-top:4px}
.status{font-family:var(--mono);font-size:.82rem;color:var(--ink-2);min-height:1.4em}
.out{white-space:pre-wrap;font-family:var(--body);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:14px;min-height:160px;line-height:1.55}
textarea.out{width:100%;min-height:260px}
.list .item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.list .item:last-child{border-bottom:0}
.list .item .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.note{font-size:.88rem;color:var(--ink-2);padding:10px 12px;background:var(--accent-soft);border-radius:6px}
.err{font-size:.9rem;color:var(--forte);background:var(--forte-soft);padding:10px 12px;border-radius:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ---- Graphiques ---- */
.comp{display:flex;gap:2px;height:28px;border-radius:4px;overflow:hidden;background:var(--paper)}
.comp span{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.8rem;font-weight:500;color:var(--paper);min-width:28px;font-variant-numeric:tabular-nums}
.comp .forte{background:var(--forte)} .comp .partielle{background:var(--partielle)} .comp .faible{background:var(--faible)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .forte{background:var(--forte)} .legend .partielle{background:var(--partielle)} .legend .faible{background:var(--faible)}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter b{width:18px;height:8px;border-radius:2px;background:var(--line)}
.meter.forte b.on{background:var(--forte)} .meter.partielle b.on{background:var(--partielle)} .meter.faible b.on{background:var(--faible)} .meter.acc b.on{background:var(--accent)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .n{min-width:0;overflow-wrap:anywhere;font-size:.95rem}
.ringbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:96px;height:96px}
.ring .track{fill:none;stroke:var(--line);stroke-width:10}
.ring .val{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .4s}
.ring text{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:26px}
.hbars{display:flex;flex-direction:column;gap:8px;min-width:0}
.hbar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:.85rem;color:var(--ink-2)}
.hbar .t{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.hbar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.hero{display:grid;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px}
.hero .tag{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:4px;justify-self:start}
.blueprint{width:100%;height:auto;display:block;color:var(--ink-3)}

/* ---- Accueil : deux portes ---- */
.bigdoors{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.bigdoors{grid-template-columns:1fr 1fr}}
.bigdoor{display:flex;flex-direction:column;gap:12px;text-align:left;border:0;border-radius:10px;padding:22px 20px;cursor:pointer;font-family:var(--body);min-width:0;background:var(--d-bg);color:var(--d-fg)}
.bigdoor.ent{--d-bg:var(--ent-bg);--d-fg:var(--ent-fg)}

.bigdoor:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.bigdoor .who{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.bigdoor .bt{font-size:1.1rem;font-weight:600;opacity:.95}
.bigdoor ul{margin:0;padding-left:18px;font-size:.95rem;opacity:.9;display:flex;flex-direction:column;gap:4px}
.bigdoor .cta{align-self:flex-start;margin-top:4px;background:var(--d-fg);color:var(--d-bg);font-weight:700;padding:10px 14px;border-radius:6px}
.illus{width:100%;max-width:300px;height:auto;opacity:.85}
/* ---- Module entrepreneur ---- */
.voicebar svg{flex:0 0 auto;width:22px;height:22px}
.voicebar{display:flex;gap:10px;align-items:center;background:var(--ent-bg);color:var(--ent-fg);padding:12px 14px;border-radius:8px;font-weight:500}
.mgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.mgrid{grid-template-columns:1fr 1fr}}
.mcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;color:var(--ink);font-family:var(--body);min-width:0}
.mcard:hover{border-color:var(--accent)}
.mcard .mt{font-weight:600;min-width:0}
.mcard.locked{background:var(--bg)}
.say{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.btn.mic{display:inline-flex;align-items:center;gap:8px;background:var(--ent-bg);color:var(--ent-fg);border-color:var(--ent-bg)}
.btn.mic.live{background:var(--forte);border-color:var(--forte);color:var(--paper)}
.michint{display:none;font-size:.9rem;background:var(--accent-soft);color:var(--ink);padding:10px 12px;border-radius:6px}
.michint.on{display:block}
textarea.bigta{min-height:160px;font-size:1.05rem}
.entbox{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.entbox summary,.exd summary{cursor:pointer;font-weight:600}
.exd{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.said{display:flex;gap:8px;align-items:flex-start;font-style:italic;color:var(--ink-2);font-size:.92rem}
.said svg{flex:0 0 auto;margin-top:2px;color:var(--accent)}
pre.doc{margin:0;white-space:pre-wrap;overflow-x:auto;font-family:var(--mono);font-size:.78rem;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;color:var(--ink)}

/* ---- Accueil froid ---- */
.cold{background:var(--cold-bg);color:var(--cold-fg);border-radius:12px;padding:22px 16px 16px;display:flex;flex-direction:column;gap:12px}
.cold .eyebrow{color:var(--cold-dim)}
.cold h1{font-size:clamp(2.2rem,9vw,3.4rem);text-transform:uppercase;letter-spacing:0}
.cold .lead{color:var(--cold-dim);font-size:1.05rem;max-width:34em}
.bigdoors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.bigdoor{padding:16px 12px;gap:10px;border-radius:10px}
.bigdoor .who{font-size:clamp(1rem,5vw,2.4rem);text-transform:uppercase;letter-spacing:0;white-space:nowrap}
.bigdoor .bt{font-size:clamp(.95rem,3.8vw,1.15rem);font-weight:700;line-height:1.25}
.bigdoor .cta{font-size:.85rem;padding:9px 10px}
.bigdoor .illus{max-width:100%}
.twocol{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.twocol{grid-template-columns:1fr 1fr}}
.argue{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--a);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.argue.ent{--a:var(--ent-bg)} .argue.sal{--a:var(--sal-bg)}
.argue ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.argue .btn{align-self:flex-start}
.btn.danger{background:var(--sal-bg);color:var(--sal-fg);border-color:var(--sal-bg)}
.riskbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.riskbox .rv{font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1;text-transform:uppercase}
.rv.forte{color:var(--forte)} .rv.partielle{color:var(--partielle)} .rv.faible{color:var(--faible)}

.libre{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;font-family:var(--body);border:2px solid var(--ent-bg);background:var(--paper);color:var(--ink);border-radius:10px;padding:18px}
.libre .eyebrow{color:var(--ent-bg)}
.libre .lt{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.05}
.libre .cta{align-self:flex-start;background:var(--ent-bg);color:var(--ent-fg);font-weight:700;padding:9px 12px;border-radius:6px}

/* ---- Épuré ---- */
.cold .foot{font-size:.82rem;color:var(--cold-dim)}
.cold .foot a{color:var(--cold-fg)}
.cold .lead{font-size:1.1rem}
.linkbtn{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-family:var(--body);font-size:.95rem;cursor:pointer}
.libre{flex-direction:row;align-items:center;gap:14px}
.libre .lt{font-size:1.45rem}
.micbig{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--ent-bg);color:var(--ent-fg);display:grid;place-items:center}

.mlist{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:560px){.mlist{grid-template-columns:1fr 1fr}}
.mgroup{display:flex;flex-direction:column;min-width:0}
.mgroup .eyebrow{margin-bottom:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;text-align:left;color:var(--ink);font-family:var(--body);font-size:.98rem;cursor:pointer;min-height:44px}

.mrow svg{color:var(--ink-3);flex:0 0 auto}

.langrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langrow label{margin:0;font-weight:500;color:var(--ink-2)}
.langrow select{width:auto;min-width:10em}
.langpick{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:0 4px 0 7px;background:var(--paper);color:var(--ink);margin:0;min-height:34px;font-weight:600}
.langpick select{width:auto;border:0;background:transparent;padding:4px 2px;font-size:.78rem;font-weight:700;color:var(--ink);max-width:7.5em}

/* ---- Accueil illustré ---- */
.scene{position:relative;overflow:hidden;border-radius:14px;min-height:470px;padding:26px 20px 250px;background:#101d4d;color:#fff;isolation:isolate}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.scene-txt{position:relative;display:flex;flex-direction:column;gap:10px;max-width:30em}
.scene h1{font-size:clamp(2.2rem,9.5vw,3.6rem);text-transform:uppercase;letter-spacing:0;color:#fff;text-shadow:0 2px 18px rgba(8,14,40,.55)}
.scene .lead{font-size:1.1rem;color:#dfe6ff;text-shadow:0 1px 8px rgba(8,14,40,.6)}
.doors2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-96px 10px 0;position:relative;z-index:1}
.door2{display:flex;flex-direction:column;text-align:left;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--paper);color:var(--ink);cursor:pointer;font-family:var(--body);box-shadow:0 12px 30px rgba(10,20,50,.28);min-width:0}
.door2 .illus{display:block;width:100%;height:auto;max-width:none;opacity:1}

function promptEmploye(p){
  return `Tu es le moteur d'analyse de REBOND, un service qui aide une personne salariée à voir ce que l'IA change dans son travail et à préparer la suite. Tu rédiges TOUT le contenu textuel en ${p.langue||"français"}, au registre poli, en phrases courtes et concrètes. Les clés JSON et les valeurs d'énumération (forte, partielle, faible, proche, intermediaire, eloignee, maintenant, 90j, 12m) restent exactement en français.

PROFIL SAISI PAR LA PERSONNE (c'est la seule vérité, ne complète pas avec des suppositions) :
- Métier actuel : ${p.metier}
- Lieu : ${p.lieu}
- Tâches décrites au quotidien : ${p.taches}
- Atouts, langues, expérience déclarés : ${p.atouts || "(rien de déclaré)"}
- Objectif déclaré : ${p.objectif || "(rien de déclaré)"}
- Contraintes déclarées : ${p.contraintes || "(rien de déclaré)"}

CATALOGUE DE FORMATIONS VÉRIFIÉES (tu ne peux citer QUE ces identifiants, rien d'autre) :
${JSON.stringify(CATALOGUE.map(c=>({id:c.id,titre:c.titre,organisme:c.organisme,pays:c.pays,duree:c.duree,themes:c.themes,prerequis:c.prerequis||null})))}

RÈGLES ABSOLUES
1. Analyse UNIQUEMENT les tâches que la personne a décrites. Reformule chaque tâche en 2 à 6 mots. Le nombre de tâches analysées est le nombre de tâches distinctes réellement décrites (minimum 1, maximum 6). Tu n'inventes aucune tâche, aucune tâche "globale", aucune tâche de remplissage.
2. Avant chaque recommandation, relis le profil. Il est INTERDIT de recommander d'apprendre, de "renforcer" ou de "clarifier" une compétence, une langue ou une tâche que la personne a déjà déclarée. Si elle dit parler quatre langues, les langues sont un atout acquis, pas un point à travailler.
3. Il est INTERDIT d'écrire "indéterminable", "source non vérifiée", "à vérifier", des crochets vides, des placeholders ou toute phrase qui avoue un manque d'information. Si tu ne sais pas quelque chose, tu n'écris pas la phrase.
4. Formations : choisis uniquement dans le catalogue, par identifiant, et seulement si le thème correspond vraiment à la piste. Si rien ne correspond, tableau vide. Pour chaque piste, "a_apprendre" ne contient QUE ce qui manque par rapport au profil déclaré.
5. Exposition d'une tâche : "forte" = l'IA produit aujourd'hui un premier jet utilisable de cette tâche (rédaction, mise en forme, calcul, synthèse, courrier, tableaux) ; "partielle" = l'IA assiste une part, le cœur reste humain (lecture de plans, contrôle, arbitrage technique) ; "faible" = tâche principalement physique, relationnelle, de terrain ou de responsabilité.
6. "geste_ia" = une action que la personne peut faire dès cette semaine avec un outil d'IA sur cette tâche précise, formulée comme une consigne concrète (exemple : "Collez votre bordereau dans un assistant IA et demandez-lui de repérer les postes manquants ou incohérents, puis vérifiez les quantités vous-même").
7. Plan d'action : 6 à 8 actions, toutes faisables par la personne elle-même, aucune ne doit lui demander de refaire ce que REBOND vient de faire (pas "listez vos tâches", pas "cartographiez votre poste"). Horizons : "maintenant" (cette semaine), "90j", "12m".
8. "presentation" : 3 à 5 phrases à la première personne, prêtes à coller dans un CV ou un profil, basées uniquement sur ce qui est déclaré.

Réponds UNIQUEMENT avec un objet JSON de cette forme exacte, sans texte autour :
{
 "titre": "titre court du dossier (métier + lieu)",
 "resume": "3 phrases : ce qui est exposé, ce qui protège, ce qu'il faut faire maintenant",
 "taches": [{"nom":"...", "exposition":"forte|partielle|faible", "pourquoi":"1-2 phrases", "ia_fait_deja":"ce que l'IA fait déjà sur cette tâche", "reste_humain":"ce qui reste humain", "geste_ia":"consigne concrète"}],

 "plan": [{"horizon":"maintenant|90j|12m", "titre":"verbe à l'infinitif + objet", "detail":"1-2 phrases"}],
 "presentation": "..."
}`;
}

// Nettoyage défensif : même si le moteur dérape, aucun placeholder n'atteint l'écran.
function sanitize(r){
  const ok=new Set(CATALOGUE.map(c=>c.id));
  const bad=/indéterminable|source non vérifiée|aucune source|non vérifié/i;
  const cl=s=>{ s=cleanText(s); return bad.test(s)?"":s; };
  r=r||{};
  r.titre=cl(r.titre)||"Bilan";
  r.resume=cl(r.resume);
  r.taches=(Array.isArray(r.taches)?r.taches:[]).slice(0,6).map(t=>({nom:cl(t.nom),exposition:["forte","partielle","faible"].includes(t.exposition)?t.exposition:"partielle",pourquoi:cl(t.pourquoi),ia_fait_deja:cl(t.ia_fait_deja),reste_humain:cl(t.reste_humain),geste_ia:cl(t.geste_ia)})).filter(t=>t.nom);
  r.atouts_releves=(Array.isArray(r.atouts_releves)?r.atouts_releves:[]).map(cl).filter(Boolean);
  r.pistes=(Array.isArray(r.pistes)?r.pistes:[]).slice(0,4).map(p=>({metier:cl(p.metier),proximite:["proche","intermediaire","eloignee"].includes(p.proximite)?p.proximite:"intermediaire",pourquoi_vous:cl(p.pourquoi_vous),a_apprendre:(Array.isArray(p.a_apprendre)?p.a_apprendre:[]).map(cl).filter(Boolean),premier_test:cl(p.premier_test),formations:(Array.isArray(p.formations)?p.formations:[]).filter(id=>ok.has(id))})).filter(p=>p.metier);
  r.plan=(Array.isArray(r.plan)?r.plan:[]).slice(0,8).map(a=>({horizon:["maintenant","90j","12m"].includes(a.horizon)?a.horizon:"90j",titre:cl(a.titre),detail:cl(a.detail)})).filter(a=>a.titre);
  r.presentation=cl(r.presentation);
  return r;
}

// ---------- Dictée ----------
// Le micro passe par le clavier du téléphone (fiable partout). Si le navigateur autorise la reconnaissance vocale ici, le bouton l'utilise.
function micIcon(){ const w=document.createElement("span"); w.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`; return w.firstElementChild; }
function dictateButton(ta,hint){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const b=el("button",{class:"btn mic",type:"button"},micIcon(),el("span",{},"Parler"));
  let rec=null, base="";
  const fallback=()=>{ hint.textContent="Touchez la zone de texte, puis le micro de votre clavier, et parlez. Le texte s'écrit tout seul."; hint.classList.add("on"); ta.focus(); };
  b.addEventListener("click",()=>{
    if(rec){ rec.stop(); return; }
    if(!SR){ fallback(); return; }
    try{
      rec=new SR(); rec.lang=navigator.language||"fr-FR"; rec.interimResults=true; rec.continuous=true;
      base=ta.value?ta.value.trim()+" ":"";
      rec.onresult=e=>{ let t=""; for(const r of e.results) t+=r[0].transcript; ta.value=base+t; };
      rec.onerror=()=>{ rec=null; b.classList.remove("live"); b.lastChild.textContent="Parler"; fallback(); };
      rec.onend=()=>{ rec=null; b.classList.remove("live"); b.lastChild.textContent="Parler"; };
      rec.start(); b.classList.add("live"); b.lastChild.textContent="J'écoute… touchez pour arrêter";
    }catch(e){ rec=null; fallback(); }
  });
  return b;
}

    engineNote(),

      el("div",{class:"row",style:"align-items:center"},dictateButton(ta,hint),el("span",{class:"small muted"},"Dans l'ordre que vous voulez, avec vos mots.")),
      hint, ta,
      el("div",{class:"langrow"},el("label",{for:"langueDoc"},"Document rédigé en"),iLang),
      el("div",{class:"row",style:"align-items:center"},btn,status)

}

l erstellen lässt und sie kontrolliert.","Un constat tâche par tâche, pas une prédiction sur votre poste.":"Eine Feststellung Aufgabe für Aufgabe, keine Prognose zu Ihrer Stelle.","Expérience de chantier":"Baustellenerfahrung","Quatre langues":"Vier Sprachen","Tâche par tâche":"Aufgabe für Aufgabe","forte exposition":"hohe Betroffenheit","Structurer des postes, des quantités et des prix est exactement ce qu'un assistant IA sait mettre en forme.":"Positionen, Mengen und Preise zu strukturieren ist genau das, was ein KI-Assistent in Form bringen kann.","L'IA fait déjà":"Die KI kann das bereits","Premier jet de bordereau à partir d'une liste de postes, repérage des postes manquants.":"Erster Entwurf eines Leistungsverzeichnisses aus einer Positionsliste, Erkennen fehlender Positionen.","Reste humain":"Bleibt beim Menschen","Le choix des prix, les variantes, la responsabilité de l'offre.":"Die Wahl der Preise, Varianten, die Verantwortung für das Angebot.","À essayer cette semaine ·":"Diese Woche ausprobieren ·","Collez un bordereau récent dans un assistant IA et demandez les postes incohérents ou oubliés, puis vérifiez-les vous-même.":"Fügen Sie ein aktuelles Leistungsverzeichnis in einen KI-Assistenten ein und fragen Sie nach widersprüchlichen oder vergessenen Positionen. Prüfen Sie diese dann selbst.","Les logiciels BIM extraient déjà les quantités d'une maquette.":"BIM-Software extrahiert bereits die Mengen aus einem Modell.","Extraction de quantités depuis une maquette, calculs répétitifs.":"Mengenermittlung aus einem Modell, wiederkehrende Berechnungen.","Le contrôle des hypothèses et des pertes, les cas non modélisés.":"Die Prüfung der Annahmen und des Verschnitts, nicht modellierte Fälle.","Faites vérifier par l'IA le détail de calcul d'un métré que vous avez déjà terminé.":"Lassen Sie die KI den Rechenweg eines bereits fertigen Aufmaßes prüfen.","L'IA aide à la mise en page et aux nomenclatures, pas aux choix techniques.":"Die KI hilft bei Layout und Stücklisten, nicht bei technischen Entscheidungen.","Nomenclatures, cartouches, annotations répétitives.":"Stücklisten, Schriftfelder, wiederkehrende Beschriftungen.","Les choix constructifs, la cohérence avec le terrain.":"Konstruktive Entscheidungen, Übereinstimmung mit der Baustelle.","Demandez à l'IA une liste de contrôle des points à vérifier sur un plan avant diffusion.":"Lassen Sie sich von der KI eine Checkliste der Punkte erstellen, die vor der Freigabe auf einem Plan zu prüfen sind.","faible exposition":"geringe Betroffenheit","Coordination, terrain et responsabilité : le cœur reste humain.":"Koordination, Baustelle und Verantwortung: Der Kern bleibt menschlich.","Brouillons de planning et de comptes rendus.":"Entwürfe für Zeitpläne und Protokolle.","Arbitrages, relations avec les corps de métier, sécurité.":"Abwägungen, Beziehungen zu den Gewerken, Sicherheit.","Dictez vos notes de réunion et faites-en sortir un compte rendu à relire.":"Diktieren Sie Ihre Besprechungsnotizen und lassen Sie daraus ein Protokoll zum Gegenlesen erstellen.","Voir mes pistes":"Meine Wege ansehen","Trois métiers où ce que vous savez déjà compte.":"Drei Berufe, in denen zählt, was Sie schon wissen.","Pour chacun : ce qui vous rapproche, ce qui manque vraiment, un premier test gratuit, et les formations que nous avons vérifiées.":"Für jeden: was Sie näherbringt, was wirklich fehlt, ein erster kostenloser Test und die von uns geprüften Weiterbildungen.","proche de votre poste":"nah an Ihrer Stelle","Conducteur de travaux":"Bauleiter","Vous préparez déjà les chantiers et connaissez le terrain. Vos quatre langues sont un avantage direct au Luxembourg.":"Sie bereiten bereits Baustellen vor und kennen die Praxis. Ihre vier Sprachen sind in Luxemburg ein direkter Vorteil.","Ce qui manque, et seulement ça":"Was fehlt, und nur das","Pilotage budgétaire d'un chantier":"Budgetsteuerung einer Baustelle","Premier test ·":"Erster Test ·","Accompagner un conducteur de travaux sur une réunion de coordination.":"Einen Bauleiter bei einer Koordinationsbesprechung begleiten.","Formations vérifiées":"Geprüfte Weiterbildungen","à portée avec un effort":"mit Aufwand erreichbar","Métreur-deviseur BIM":"BIM-Mengenermittler und Kalkulator","Vous faites déjà des métrés et des bordereaux : la maquette BIM rend ce travail plus rapide.":"Sie erstellen bereits Aufmaße und Leistungsverzeichnisse: Das BIM-Modell macht diese Arbeit schneller.","Revit · Extraction de quantités depuis une maquette":"Revit · Mengenermittlung aus einem Modell","Refaire un bordereau réel à partir d'une maquette d'essai gratuite.":"Ein reales Leistungsverzeichnis aus einem kostenlosen Testmodell neu erstellen.","plus éloigné":"weiter entfernt","Coordinateur BIM junior":"Junior-BIM-Koordinator","Votre lecture de plans et votre expérience de chantier sont rares chez les profils BIM.":"Ihr Planverständnis und Ihre Baustellenerfahrung sind bei BIM-Profilen selten.","Méthodes de coordination BIM":"Methoden der BIM-Koordination","Suivre une initiation BIM courte en ligne.":"Eine kurze Online-Einführung in BIM besuchen.","Passer au plan d'action":"Zum Aktionsplan","proximité":"Nähe","Avancez à votre rythme.":"Kommen Sie in Ihrem Tempo voran.","Cette semaine":"Diese Woche","À 90 jours":"In 90 Tagen","À 12 mois":"In 12 Monaten","Tester l'IA sur un bordereau":"Die KI an einem Leistungsverzeichnis testen","Un bordereau récent, une demande de contrôle, une vérification.":"Ein aktuelles Leistungsverzeichnis, eine Prüfanfrage, eine Kontrolle.","Noter le temps passé par tâche":"Zeitaufwand pro Aufgabe notieren","Une semaine, pour savoir où l'IA vous fait gagner le plus.":"Eine Woche lang, um zu sehen, wo die KI Ihnen am meisten Zeit spart.","Suivre une initiation Revit":"Eine Revit-Einführung besuchen","Voir la fiche TASE Solutions dans vos pistes.":"Das Datenblatt von TASE Solutions unter Ihren Wegen ansehen.","Refaire un métré depuis une maquette":"Ein Aufmaß aus einem Modell neu erstellen","Comparer avec votre métré const UI_LANGS=[["fr","Français"],["de","Deutsch"],["en","English"],["nl","Nederlands"],["lb","Lëtzebuergesch"],["pt","Português"],["it","Italiano"],["es","Español"]];
const UI_TO_OUT={fr:"français",de:"allemand",en:"anglais",nl:"néerlandais",lb:"luxembourgeois",pt:"portugais",it:"italien",es:"espagnol"};
const okLang=c=>c==="fr"||!!I18N[c];
function detectLang(){
  const h=(location.hash||"").slice(1).toLowerCase(); if(okLang(h)) return h;
  try{ const s=localStorage.getItem("rebond.lang"); if(s&&okLang(s)) return s; }catch(e){}
  for(const l of (navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"fr"])){ const c=String(l).toLowerCase().slice(0,2); if(okLang(c)) return c; }
  return "fr";
}
let UILANG=detectLang(), PAT=[];
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function buildPat(){ const d=I18N[UILANG]; PAT=d?Object.entries(d.p).map(([fr,t])=>({re:new RegExp("^"+reEsc(fr).replace(/\\\{(\d)\\\}/g,"([\\s\\S]+?)")+"$"),t})):[]; }
function tr(str){
  const d=I18N[UILANG]; if(!d||!str) return str;
  const m0=/^(\s*)([\s\S]*?)(\s*)$/.exec(str), core=m0[2]; if(!core) return str;
  let out=d.s[core];
  if(out===undefined){ for(const {re,t} of PAT){ const m=re.exec(core); if(m){ out=t.replace(/\{(\d)\}/g,(_,i)=>tr(m[+i+1])); break; } } }
  return out===undefined?str:m0[1]+out+m0[3];
}
const ATTRS=["placeholder","aria-label","title"];
function trNode(n){
  if(n.nodeType===3){
    if(!n.parentElement||n.parentElement.closest("script,style,[data-noi18n]")) return;
    if(n.__tr!==n.nodeValue) n.__fr=n.nodeValue;
    const v=tr(n.__fr); n.__tr=v; if(n.nodeValue!==v) n.nodeValue=v;
  } else if(n.nodeType===1){
    if(n.matches("script,style,[data-noi18n]")) return;
    n.__fra=n.__fra||{};
    for(const a of ATTRS){ const cur=n.getAttribute(a); if(cur==null) continue; if(n.__fra[a+"_t"]!==cur) n.__fra[a]=cur; const v=tr(n.__fra[a]); n.__fra[a+"_t"]=v; if(cur!==v) n.setAttribute(a,v); }
    for(const c of n.childNodes) trNode(c);
  }
}
const ROOT=document.querySelector(".wrap");
new MutationObserver(ms=>{ for(const m of ms){ if(m.type==="childList") m.addedNodes.forEach(trNode); else if(m.type==="characterData") trNode(m.target); else if(m.type==="attributes") trNode(m.target); } })
  .observe(ROOT,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTRS});
function setLang(c){ UILANG=c; buildPat(); document.documentElement.lang=c; try{ localStorage.setItem("rebond.lang",c); }catch(e){} trNode(ROOT); }
buildPat(); document.documentElement.lang=UILANG;
